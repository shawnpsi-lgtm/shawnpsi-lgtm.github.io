    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 24px; margin: 0 0 40px; }
    .tiles div { border-top: 1px solid var(--border); padding-top: 12px; }

    .tiles dd { margin: 4px 0 0; font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; color: var(--black); font-variant-numeric: tabular-nums; }

    .days, .bars { display: grid; align-content: start; grid-template-rows: repeat(7, 13px); gap: 3px; }

    .bars { grid-auto-flow: column; grid-auto-columns: 13px; overflow-x: auto; min-width: 0; padding: 2px; }
    .bars > div { border-radius: 3px; background: var(--border); cursor: default; }
    .bars > div[data-l="1"] { background: var(--l1); }
    .bars > div[data-l="2"] { background: var(--l2); }
    .bars > div[data-l="3"] { background: var(--l3); }
    .bars > div[data-l="4"] { background: var(--l4); }
    .bars > .pad { visibility: hidden; }
    .bars > div:hover, .bars > div:focus { outline: 1px solid var(--mid); }
    .bars > div:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .axis { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--mid); margin-top: 10px; }
    .axis i { width: 12px; height: 12px; border-radius: 3px; background: var(--border); }

  <script>
    const W = 'https://groq-chat.shawnpsi.workers.dev';
    // Each request resolves or throws; ten seconds without an answer counts as a failure.
    const ok = r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r; };
    const withTimeout = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timed out')), 10000))]);

    // Usage: the worker logs every chat answer to D1 against the signed-in account;
    // /usage returns that account's daily aggregates, never message content.
    // The session is the one chat.js keeps after sign-in.
    const fmt = n => n.toLocaleString();
    async function usage() {
      const meta = document.getElementById('usage-meta');
      let token = null;
      // Straight back from sign-in, the session is still in the URL (chat.js stores it after this runs).
      token = location.hash.match(/^#session=([\w.-]+)$/)?.[1] || null;
      try { token ??= localStorage.getItem('shawn-ai-session'); } catch {}
      if (!token) {
        document.getElementById('tiles').replaceChildren();
        document.getElementById('bars').closest('figure').hidden = true;
        meta.textContent = 'Sign in from the chat to see your own usage.';
        return;
      }
      let d;
      try { d = await withTimeout(fetch(W + '/usage', { headers: { Authorization: 'Bearer ' + token } }).then(ok).then(r => r.json())); }
      catch (e) { meta.textContent = e.message === 'HTTP 401' ? 'Your sign-in expired. Sign in from the chat again.' : 'Usage unavailable · ' + e.message; return; }
      document.getElementById('bars').closest('figure').hidden = false;
      const byDay = Object.fromEntries(d.days.map(x => [x.day, x]));
      const days = Array.from({ length: 182 }, (_, i) => new Date(Date.now() - (181 - i) * 864e5).toISOString().slice(0, 10))
        .map(day => byDay[day] || { day, answers: 0, prompt: 0, cached: 0, out: 0 });
      const today = days.at(-1);
      const sum = (k, d = days) => d.reduce((s, x) => s + (x[k] || 0), 0);
      const tiles = [
        ['Answers today', fmt(today.answers)],
        ['Tokens today', fmt((today.prompt || 0) + (today.out || 0))],
        ['Cache hit, 14 d', sum('prompt', days.slice(-14)) ? Math.round(100 * sum('cached', days.slice(-14)) / sum('prompt', days.slice(-14))) + '%' : '—'],
        ['Median reply, 24 h', d.median_ms == null ? '—' : (d.median_ms / 1000).toFixed(1) + ' s'],
      ];
      document.getElementById('tiles').replaceChildren(...tiles.map(([k, v]) => {
        const div = document.createElement('div');
        div.append(Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { textContent: v }));
        return div;
      }));

      const max = Math.max(1, ...days.map(x => x.answers));
      const label = x => new Date(x.day + 'T12:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
      const tip = document.getElementById('tip'), fig = tip.parentElement;
      // Pad the first week so each day lands on its weekday row.
      const pad = Array.from({ length: new Date(days[0].day + 'T12:00Z').getUTCDay() }, () => Object.assign(document.createElement('div'), { className: 'pad' }));
      document.getElementById('bars').replaceChildren(...pad, ...days.map(x => {
        const col = document.createElement('div');
        col.tabIndex = 0;
        col.setAttribute('aria-label', `${label(x)}: ${x.answers} answers`);
        col.dataset.l = x.answers ? Math.ceil(4 * x.answers / max) : 0;
        const show = () => {
          tip.textContent = `${label(x)} · ${fmt(x.answers)} answers · ${fmt((x.prompt || 0) + (x.out || 0))} tokens`;
          tip.hidden = false;
          const c = col.getBoundingClientRect(), f = fig.getBoundingClientRect();
          // Keep the tip inside the figure, just below the hovered cell.
          tip.style.left = Math.min(Math.max(c.left - f.left + c.width / 2, tip.offsetWidth / 2), f.width - tip.offsetWidth / 2) + 'px';
          tip.style.top = c.bottom - f.top + 6 + 'px';
        };
        const hide = () => { tip.hidden = true; };
        col.addEventListener('mouseenter', show); col.addEventListener('focus', show);
        col.addEventListener('mouseleave', hide); col.addEventListener('blur', hide);
        return col;
      }));
      // On narrow screens the graph scrolls; start at the latest week.
      const bars = document.getElementById('bars'); bars.scrollLeft = bars.scrollWidth;
      document.getElementById('axis').replaceChildren('Less', ...[0, 1, 2, 3, 4].map(l => {
        const i = document.createElement('i');
        if (l) i.style.background = `var(--l${l})`;
        return i;
      }), 'More');
      document.getElementById('usage-meta').textContent = `${fmt(sum('answers'))} answer${sum('answers') === 1 ? '' : 's'} in 26 weeks · peak ${fmt(Math.max(...days.map(x => x.answers)))} in a day · counts your signed-in chat answers`;
    }
    usage();
    setInterval(usage, 60000);
  </script>
