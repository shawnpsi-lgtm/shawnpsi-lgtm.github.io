<!DOCTYPE html>
<html lang="en" class="skin-rmx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>BEAT FX</title>
  <link rel="stylesheet" href="./css/style.css?v=17">
  <link rel="stylesheet" href="./css/skin-rmx.css?v=23">
</head>
<body>
  <main class="panel">
    <!-- 0. Track strip -->
    <section class="track-strip">
      <div class="file-row">
        <button id="deck-btn" class="deck-btn" aria-label="Switch deck">DECK 1</button>
        <label class="file-label" for="file-input">
          <span id="file-name">LOAD TRACK&hellip;</span>
        </label>
      </div>
      <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.flac,audio/*" hidden>
      <div class="transport-row">
        <div id="seek-bar" class="seek-bar">
          <canvas id="seek-wave" class="seek-wave"></canvas>
          <div id="seek-fill" class="seek-fill"></div>
        </div>
        <div class="bpm-readout"><span id="bpm-value">120</span><small>BPM</small></div>
        <button id="sync-btn" class="sync-btn" disabled aria-label="Sync to other deck">SYNC</button>
      </div>
    </section>

    <!-- 1. X-PAD -->
    <section class="xpad-wrap">
      <div class="section-label xpad-label">
        <div class="dropdown">
          <button id="xpad-mode" class="xpad-mode" aria-haspopup="listbox"
                  aria-expanded="false">X-PAD &middot; FX</button>
          <div id="xpad-menu" class="dd-menu" role="listbox" aria-label="X-PAD effect" hidden>
            <button class="dd-item selected" role="option" aria-selected="true" data-value="fx">FX</button>
            <button class="dd-item" role="option" aria-selected="false" data-value="filter">FILTER</button>
            <button class="dd-item" role="option" aria-selected="false" data-value="reverb">REVERB</button>
          </div>
        </div>
      </div>
      <div id="xpad" class="xpad"></div>
    </section>

    <!-- 2. BEAT row -->
    <section class="beat-row">
      <button id="beat-down" class="beat-arrow" aria-label="Halve beat">&#9664;</button>
      <div class="beat-center">
        <div class="section-label">BEAT</div>
        <div id="beat-value" class="beat-value">1/2</div>
      </div>
      <button id="beat-up" class="beat-arrow" aria-label="Double beat">&#9654;</button>
    </section>

    <!-- 3. AUTO/TAP row -->
    <section class="tap-row">
      <button id="auto-tap" class="small-btn active">AUTO<span class="slash">/</span>TAP</button>
      <button id="tap-btn" class="tap-btn">TAP</button>
      <button id="quantize" class="small-btn">QUANTIZE<span class="dot"></span></button>
    </section>

    <!-- 4. FX FREQUENCY -->
    <section class="freq-section">
      <div class="section-label">FX FREQUENCY</div>
      <div class="freq-row">
        <button class="freq-btn" data-band="low">LOW</button>
        <button class="freq-btn" data-band="mid">MID</button>
        <button class="freq-btn" data-band="hi">HI</button>
      </div>
    </section>

    <!-- 5. EFFECT SELECT -->
    <section class="select-section">
      <div class="section-label">EFFECT SELECT</div>
      <div id="fx-knob" class="knob knob-lg">
        <div class="knob-indicator"></div>
      </div>
      <div class="fx-labels">
        <span data-fx="0">REVERB</span>
        <span data-fx="1" class="lit">ECHO</span>
        <span data-fx="2">DUB</span>
      </div>
    </section>

    <!-- 6. TIME + LEVEL/DEPTH -->
    <section class="knob-row">
      <div class="knob-cell">
        <div class="section-label">TIME</div>
        <div id="time-knob" class="knob">
          <div class="knob-indicator"></div>
        </div>
        <div class="minmax"><span>MIN</span><span>MAX</span></div>
      </div>
      <!-- 7. ON/OFF: round illuminated dome, printed label above -->
      <div class="onoff-cell">
        <div class="section-label">ON/OFF</div>
        <button id="onoff" class="onoff" aria-label="Effect on/off"></button>
      </div>
      <div class="knob-cell">
        <div class="section-label">LEVEL/DEPTH</div>
        <div id="level-knob" class="knob">
          <div class="knob-indicator"></div>
        </div>
        <div class="minmax"><span>MIN</span><span>MAX</span></div>
      </div>
    </section>

    <!-- 8. Bottom transport: CUE / PLAY / NUDGE + HOT CUE (one row) -->
    <section class="transport-deck">
      <button id="cue-btn" class="cue-btn" disabled>CUE</button>
      <button id="play-btn" class="play-btn" disabled aria-label="Play / pause">&#9654;</button>
      <div class="nudge-group">
        <div class="section-label">NUDGE</div>
        <div class="nudge-row">
          <button id="nudge-back" class="nudge-btn" disabled aria-label="Nudge back">&#9664;</button>
          <button id="nudge-fwd" class="nudge-btn" disabled aria-label="Nudge forward">&#9654;</button>
        </div>
      </div>
      <div class="hotcue-group">
        <div class="section-label">HOT CUE</div>
        <div class="hotcue-row">
          <button id="hotcue-a" class="hotcue-btn cue-a" data-cue="0" disabled>A</button>
          <button id="hotcue-b" class="hotcue-btn cue-b" data-cue="1" disabled>B</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/knob.js?v=6"></script>
  <script src="./js/audio.js?v=19"></script>
  <script src="./js/app.js?v=20"></script>
</body>
</html>
