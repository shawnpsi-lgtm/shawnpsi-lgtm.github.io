<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <title>BEAT FX</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./css/style.css?v=1">
</head>
<body>
  <main class="panel">
    <header class="topbar">
      <a href="/" class="brand" aria-label="Shawn Singh home">
        <svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true">
          <defs><radialGradient id="sg" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#d9a8f5"/><stop offset="55%" stop-color="#b36fd9"/><stop offset="100%" stop-color="#9a4fc4"/></radialGradient></defs>
          <circle cx="50" cy="50" r="50" fill="url(#sg)"/>
          <text x="50" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="52" font-weight="600" fill="white">S</text>
        </svg>
        Beat FX
      </a>
      <button id="theme-btn" class="theme-btn" aria-label="Toggle light/dark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>
    <!-- 0. Track strip: pages between the controls and the live 2-deck
         waveform close-up; the pager arrows live in the panel gutter -->
    <section class="track-strip" id="track-strip">
      <button id="strip-prev" class="strip-arrow strip-arrow-l" aria-label="Switch strip view">&#9664;</button>
      <button id="strip-next" class="strip-arrow strip-arrow-r" aria-label="Switch strip view">&#9654;</button>
      <canvas id="wave-zoom" class="wave-zoom"></canvas>
      <div class="file-row">
        <button id="deck-btn" class="deck-btn" aria-label="Switch deck">DECK 1</button>
        <label class="file-label" for="file-input">
          <span id="file-name">LOAD TRACK&hellip;</span>
        </label>
        <button id="r2-btn" class="deck-btn" aria-label="Load from r2music">R2</button>
      </div>
      <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.flac,audio/*" hidden>
      <div class="transport-row">
        <div id="seek-bar" class="seek-bar">
          <canvas id="seek-wave" class="seek-wave"></canvas>
          <div id="seek-fill" class="seek-fill"></div>
        </div>
        <div class="bpm-readout"><span id="bpm-value">120</span><small>BPM</small></div>
        <button id="sync-btn" class="sync-btn" disabled aria-label="Sync to other deck">SYNC</button>
      </div>
    </section>

    <!-- 1. X-PAD -->
    <section class="xpad-wrap">
      <div class="section-label xpad-label">
        <div class="dropdown">
          <button id="xpad-mode" class="xpad-mode" aria-haspopup="listbox"
                  aria-expanded="false">X-PAD &middot; FILTER</button>
          <div id="xpad-menu" class="dd-menu" role="listbox" aria-label="X-PAD effect" hidden>
            <button class="dd-item" role="option" aria-selected="false" data-value="fx">FX</button>
            <button class="dd-item selected" role="option" aria-selected="true" data-value="filter">FILTER</button>
            <button class="dd-item" role="option" aria-selected="false" data-value="reverb">REVERB</button>
          </div>
        </div>
      </div>
      <div id="xpad" class="xpad"></div>
    </section>

    <!-- 2. BEAT row -->
    <section class="beat-row">
      <button id="beat-down" class="beat-arrow" aria-label="Halve beat">&#9664;</button>
      <div class="beat-center">
        <div class="section-label">BEAT</div>
        <div id="beat-value" class="beat-value">1/2</div>
      </div>
      <button id="beat-up" class="beat-arrow" aria-label="Double beat">&#9654;</button>
    </section>

    <!-- 3. AUTO/TAP row -->
    <section class="tap-row">
      <button id="auto-tap" class="small-btn active">AUTO<span class="slash">/</span>TAP</button>
      <button id="tap-btn" class="tap-btn">TAP</button>
      <button id="quantize" class="small-btn">QUANTIZE<span class="dot"></span></button>
    </section>

    <!-- 4. FX FREQUENCY -->
    <section class="freq-section">
      <div class="section-label">FX FREQUENCY</div>
      <div class="freq-row">
        <button class="freq-btn" data-band="low">LOW</button>
        <button class="freq-btn" data-band="mid">MID</button>
        <button class="freq-btn" data-band="hi">HI</button>
      </div>
    </section>

    <!-- 5. EFFECT SELECT -->
    <section class="select-section">
      <div class="section-label">EFFECT SELECT</div>
      <div class="fxvol-cell">
        <div class="section-label">FX VOL</div>
        <div id="fxvol-knob" class="knob knob-sm">
          <div class="knob-indicator"></div>
        </div>
      </div>
      <div id="fx-knob" class="knob knob-lg">
        <div class="knob-indicator"></div>
      </div>
      <div class="fx-labels">
        <span data-fx="0">REVERB</span>
        <span data-fx="1" class="lit">ECHO</span>
        <span data-fx="2">DUB</span>
        <span data-fx="3">DRUM</span>
        <span data-fx="4">NOISE</span>
      </div>
    </section>

    <!-- 6. TIME + LEVEL/DEPTH -->
    <section class="knob-row">
      <div class="knob-cell">
        <div class="section-label" id="time-label">TIME</div>
        <div id="time-knob" class="knob">
          <div class="knob-indicator"></div>
        </div>
        <div class="minmax"><span>MIN</span><span>MAX</span></div>
      </div>
      <!-- 7. ON/OFF: round illuminated dome, printed label above -->
      <div class="onoff-cell">
        <div class="section-label">ON/OFF</div>
        <button id="onoff" class="onoff" aria-label="Effect on/off"></button>
      </div>
      <div class="knob-cell">
        <div class="section-label" id="level-label">LEVEL/DEPTH</div>
        <div id="level-knob" class="knob">
          <div class="knob-indicator"></div>
        </div>
        <div class="minmax"><span>MIN</span><span>MAX</span></div>
      </div>
    </section>

    <!-- 8. Bottom transport: CUE / PLAY / NUDGE + HOT CUE (one row) -->
    <section class="transport-deck">
      <button id="cue-btn" class="cue-btn" disabled>CUE</button>
      <button id="play-btn" class="play-btn" disabled aria-label="Play / pause">&#9654;</button>
      <div class="nudge-group">
        <div class="section-label">NUDGE</div>
        <div class="nudge-row">
          <button id="nudge-back" class="nudge-btn" disabled aria-label="Nudge back">&#9664;</button>
          <button id="nudge-fwd" class="nudge-btn" disabled aria-label="Nudge forward">&#9654;</button>
        </div>
      </div>
      <div class="hotcue-group">
        <div class="section-label">HOT CUE</div>
        <div class="hotcue-row">
          <button id="hotcue-a" class="hotcue-btn cue-a" data-cue="0" disabled>A</button>
          <button id="hotcue-b" class="hotcue-btn cue-b" data-cue="1" disabled>B</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Load from the user's r2music library (js/r2.js) -->
  <dialog id="r2-dialog" class="r2-dialog">
    <div class="r2-head">
      <select id="r2-list" aria-label="List"><option value="">ALL TRACKS</option></select>
      <button id="r2-close" class="deck-btn" aria-label="Close">&times;</button>
    </div>
    <input id="r2-filter" type="search" placeholder="SEARCH" autocomplete="off">
    <p id="r2-status" class="r2-status"></p>
    <ul id="r2-tracks" class="r2-tracks"></ul>
  </dialog>
  <script src="./js/knob.js?v=6"></script>
  <script src="./js/audio.js?v=37"></script>
  <script src="./js/app.js?v=1"></script>
  <script src="./js/r2.js?v=2"></script>
  <script>
    document.getElementById('theme-btn').addEventListener('click', function () {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('theme', t); } catch (e) {}
    });
  </script>
</body>
</html>
