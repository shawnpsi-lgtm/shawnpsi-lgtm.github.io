<body>
  <figure id="desktop-folder" class="desktop-icon desktop-file">

  <figure class="desktop-icon desktop-file desktop-pdf" data-full="/files/The%20Psychiatric%20Bible%20-%20Shawn%20Singh.pdf" data-stem="psychiatric-bible" data-pages="10">
    <span class="pdf-icon"><img src="/images/desk/psychiatric-bible-1.png" alt="The Psychiatric Bible, first page" draggable="false" /></span>

  <figure class="desktop-icon desktop-file desktop-pdf" data-full="/files/resume.pdf" data-stem="resume" data-pages="1">

    <figcaption>resume.pdf</figcaption>
  </figure>
  <figure class="desktop-icon desktop-file" data-full="/audio/all-by-myself.mp3"
          data-title="All By Myself" data-artist="Mita Gami" data-album="All By Myself">
    <img src="/images/desk/all-by-myself.jpg" alt="All By Myself album art" draggable="false" />

  </figure>
  <figure class="desktop-icon desktop-file" data-full="/images/desk/IMG_5494.jpg">
    <img src="/images/desk/IMG_5494-thumb.jpg" alt="Artist seated on a director's chair in a white cyc studio" draggable="false" />
    <figcaption>IMG_5494.jpg</figcaption>
  </figure>
  <figure class="desktop-icon desktop-file" data-full="/images/desk/IMG_5496.jpg">
    <img src="/images/desk/IMG_5496-thumb.jpg" alt="Two people embracing on set" draggable="false" />
    <figcaption>IMG_5496.jpg</figcaption>

  <figure class="desktop-icon desktop-file" data-full="/videos/chicago.mp4">

    <figcaption>chicago.mp4</figcaption>

  <figure class="desktop-icon desktop-file" data-full="/videos/go.mp4">

    <figcaption>go.mp4</figcaption>
  </figure>

  <div id="quicklook" hidden>
    <figure>
      <figcaption><button id="ql-close" aria-label="Close"></button><span id="ql-name"></span><span id="ql-page" hidden></span><a id="ql-download" hidden href="/files/resume.pdf" download="resume.pdf">Download</a><span id="ql-open-music" hidden>Open with Music</span></figcaption>
      <img id="ql-img" alt="" />
      <video id="ql-video" hidden controls playsinline preload="none"></video>
      <div id="ql-pdf" hidden></div>
      <div id="ql-folder" hidden>
        <figure class="desktop-file" role="button" tabindex="0" data-src="/audio/dirty-talk.m4a" data-name="dirty talk.wav">
          <img src="/images/music-file-icon.png" alt="" draggable="false" />
          <figcaption>dirty talk.wav<span class="dur">00:00</span></figcaption>
        </figure>
        <figure class="desktop-file" role="button" tabindex="0" data-src="/audio/see-us-in-the-club.m4a" data-name="see us in the club.wav">
          <img src="/images/music-file-icon.png" alt="" draggable="false" />
          <figcaption>see us in the club.wav<span class="dur">00:00</span></figcaption>
        </figure>
        <figure class="desktop-file" role="button" tabindex="0" data-src="/audio/let-him-go.m4a" data-name="let him go.wav">
          <img src="/images/music-file-icon.png" alt="" draggable="false" />
          <figcaption>let him go.wav<span class="dur">00:00</span></figcaption>
        </figure>
        <figure class="desktop-file" role="button" tabindex="0" data-src="/audio/positive.m4a" data-name="positive.wav">
          <img src="/images/music-file-icon.png" alt="" draggable="false" />
          <figcaption>positive.wav<span class="dur">00:00</span></figcaption>
        </figure>
      </div>
      <div id="ql-audio" hidden>
        <div id="ql-audio-main">
          <img id="ql-art" src="/images/music-file-icon.png" alt="" draggable="false" />
          <div id="ql-audio-side">
            <label id="ql-vol">
              <input id="ql-volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volume" />
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
                <path d="M11 5 6.5 9H3v6h3.5L11 19z" fill="currentColor"/>
                <path d="M14.6 9.4a3.6 3.6 0 0 1 0 5.2M17.2 6.8a7.3 7.3 0 0 1 0 10.4"
                      fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </label>
            <div id="ql-meta">
              <p id="ql-title"></p>
              <p class="kv" id="ql-artist-row">Artist: <b id="ql-artist"></b></p>
              <p class="kv" id="ql-album-row">Album: <b id="ql-album"></b></p>
              <p class="kv">Time: <b id="ql-total-long">0:00</b></p>
            </div>
          </div>
        </div>
        <div id="ql-transport">
          <button id="ql-back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4.6a7.4 7.4 0 1 1-7.4 7.4"/><path d="M14.4 2.2 11.4 4.6l3 2.4"/>
          <text x="12" y="15.6" text-anchor="middle" fill="currentColor" stroke="none">15</text>
        </svg></button>
          <button id="ql-play" aria-label="Play or pause">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path class="i-play" d="M7 4.6a1 1 0 0 1 1.5-.87l11 7.4a1 1 0 0 1 0 1.74l-11 7.4A1 1 0 0 1 7 19.4z"/>
              <g class="i-pause">
                <rect x="6.4" y="4.4" width="4.2" height="15.2" rx="1.5"/>
                <rect x="13.4" y="4.4" width="4.2" height="15.2" rx="1.5"/>
              </g>
            </svg>
          </button>
          <button id="ql-fwd" aria-label="Forward 15 seconds"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(24 0) scale(-1 1)"><path d="M12 4.6a7.4 7.4 0 1 1-7.4 7.4"/><path d="M14.4 2.2 11.4 4.6l3 2.4"/></g>
          <text x="12" y="15.6" text-anchor="middle" fill="currentColor" stroke="none">15</text>
        </svg></button>
          <span id="ql-elapsed">00:00</span>
          <input id="ql-seek" type="range" min="0" max="0" step=".01" value="0" aria-label="Seek" />
          <span id="ql-total">00:00</span>
          <button id="ql-next" aria-label="Next track"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 5.5 11 12l-6.5 6.5"/><path d="M13 5.5 19.5 12 13 18.5"/>
          </svg></button>
        </div>
      </div>
    </figure>
  </div>

  <script>
    (() => {
      const clamp = (v, max) => Math.min(Math.max(v, 0), Math.max(max, 0));
      // left/top are document-relative, so drag in page coords too — otherwise
      // the icon jumps by scrollY the moment the page isn't at the top.
      const pageX = e => e.clientX + scrollX, pageY = e => e.clientY + scrollY;
      const icons = [...document.querySelectorAll('.desktop-icon')];
      const files = icons.filter(el => el.dataset.full);
      let z = 50;

      icons.forEach(el => {
        // Icons start life positioned by CSS; keep the live coords per element so
        // a dragged icon doesn't re-read a stale offsetLeft mid-gesture.
        let dx = 0, dy = 0, group = [];

        const grab = e => {
          el.setPointerCapture(e.pointerId);
          // Cmd/Shift extends the selection; a bare click on an unselected icon
          // replaces it — but clicking one of several selected keeps the group,
          // so you can drag the whole pile.
          if (e.metaKey || e.shiftKey) el.classList.toggle('selected');
          else if (!el.classList.contains('selected')) {
            icons.forEach(o => o.classList.toggle('selected', o === el));
          }
          group = icons.filter(o => o.classList.contains('selected'));
          if (!group.includes(el)) group = [el];
          // Whatever you grabbed last sits on top of the pile.
          group.forEach(o => { o._x = o.offsetLeft; o._y = o.offsetTop; o.style.zIndex = ++z; });
        };

        el.addEventListener('pointerdown', e => {
          if (e.target.closest('a')) return;
          // Rolled by hand: cancelling pointerdown can swallow the compat
          // dblclick event, and this works the same on touch.
          const dbl = e.timeStamp - (el._t || 0) < 400;
          el._t = e.timeStamp;
          // Mouse only. On touch a swipe over an icon has to scroll the page, so
          // nothing here claims the gesture — tap twice to open, that's it.
          if (e.pointerType !== 'touch') {
            e.preventDefault();
            dx = pageX(e); dy = pageY(e);
            grab(e);
          }
          if (dbl) open(el);
        });

        el.addEventListener('pointermove', e => {
          if (!el.hasPointerCapture(e.pointerId)) return;
          const mx = pageX(e) - dx, my = pageY(e) - dy;
          const doc = document.documentElement;
          group.forEach(o => {
            o.style.left = clamp(o._x + mx, doc.scrollWidth - o.offsetWidth) + 'px';
            o.style.top = clamp(o._y + my, doc.scrollHeight - o.offsetHeight) + 'px';
          });
        });

      });

      // Click anywhere else deselects, like the desktop.
      addEventListener('pointerdown', e => {
        icons.forEach(el => { if (!el.contains(e.target)) el.classList.remove('selected'); });
      }, true);

      // --- Quick Look ---
      const ql = document.getElementById('quicklook');
      const qlImg = document.getElementById('ql-img');
      const qlVid = document.getElementById('ql-video');
      const qlPdf = document.getElementById('ql-pdf');
      const qlName = document.getElementById('ql-name');
      const qlPage = document.getElementById('ql-page');
      const qlFolder = document.getElementById('ql-folder');
      const qlAudio = document.getElementById('ql-audio');
      const qlMusic = document.getElementById('ql-open-music');
      const qlDl = document.getElementById('ql-download');
      const folder = document.getElementById('desktop-folder');
      const tracks = [...qlFolder.querySelectorAll('[data-src]')];
      const seek = document.getElementById('ql-seek');
      const playBtn = document.getElementById('ql-play');
      let at = -1;
      let fromFolder = false;
      let pdfAt = 0, pdfN = 0;

      const player = new Audio();
      let playing = null;
      const pad = n => String(n | 0).padStart(2, '0');
      const fmt = t => pad(t / 60) + ':' + pad(t % 60);
      // Neither engine paints the played half of a range, so --p sizes a white
      // background layer behind the thumb. Has to be re-run on every change.
      const fill = el => el.style.setProperty('--p', (el.max > 0 ? el.value / el.max * 100 : 0) + '%');
      const paint = () => {
        const d = player.duration || 0;
        document.getElementById('ql-elapsed').textContent = fmt(player.currentTime);
        document.getElementById('ql-total').textContent = fmt(d);
        document.getElementById('ql-total-long').textContent = (d / 60 | 0) + ':' + pad(d % 60);
        if (!seek.matches(':active')) { seek.max = d; seek.value = player.currentTime; }
        fill(seek);
      };
      const stop = () => {
        player.pause();
        player.removeAttribute('src');
        playBtn.removeAttribute('data-playing');
        playing = null;
        qlVid.pause();
        qlVid.removeAttribute('src');
        qlVid.removeAttribute('poster');
        qlVid.load();
        qlPdf.scrollTop = 0;
        qlPage.hidden = true;
        qlDl.hidden = true;
      };
      tracks.forEach(f => {
        const a = new Audio();
        a.preload = 'metadata';
        a.src = f.dataset.src;
        a.addEventListener('loadedmetadata', () => { f.querySelector('.dur').textContent = fmt(a.duration); });
      });
      player.addEventListener('timeupdate', paint);
      player.addEventListener('loadedmetadata', paint);
      player.addEventListener('play', () => playBtn.dataset.playing = '');
      player.addEventListener('pause', () => playBtn.removeAttribute('data-playing'));
      player.addEventListener('ended', () => playBtn.removeAttribute('data-playing'));
      const playTrack = f => {
        playing = f;
        player.src = f.dataset.src || f.dataset.full;
        player.play();
        const art = f.querySelector('img');
        document.getElementById('ql-art').src = art ? art.src : '/images/music-file-icon.png';
        qlImg.hidden = true;
        qlVid.hidden = true;
        qlPdf.hidden = true;
        qlFolder.hidden = true;
        qlAudio.hidden = false;
        qlMusic.hidden = false;
        const fileName = f.dataset.name || f.querySelector('figcaption').childNodes[0].textContent.trim();
        qlName.textContent = fileName;
        document.getElementById('ql-title').textContent = f.dataset.title || fileName.replace(/\.[^.]+$/, '');
        document.getElementById('ql-artist').textContent = f.dataset.artist || '';
        document.getElementById('ql-album').textContent = f.dataset.album || '';
        document.getElementById('ql-artist-row').hidden = !f.dataset.artist;
        document.getElementById('ql-album-row').hidden = !f.dataset.album;
      };
      const pick = e => { const f = e.target.closest('[data-src]'); if (f) playTrack(f); };
      qlFolder.addEventListener('click', pick);
      qlFolder.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); }
      });
      playBtn.addEventListener('click', () => player.paused ? player.play() : player.pause());
      document.getElementById('ql-back').addEventListener('click', () => { player.currentTime = Math.max(0, player.currentTime - 15); });
      document.getElementById('ql-fwd').addEventListener('click', () => { player.currentTime += 15; });
      document.getElementById('ql-next').addEventListener('click', () => {
        if (playing) playTrack(tracks[(tracks.indexOf(playing) + 1) % tracks.length]);
      });
      const vol = document.getElementById('ql-volume');
      vol.addEventListener('input', e => { player.volume = +e.target.value; fill(vol); });
      seek.addEventListener('input', () => { player.currentTime = +seek.value; fill(seek); });
      fill(vol);

      function open(el) {
        const i = files.indexOf(el);
        if (i < 0 && el !== folder) return;      // nothing else has a preview
        at = i;
        fromFolder = el === folder;
        stop();
        const src = el.dataset.full || '';
        const vid = i >= 0 && /\.mp4$/i.test(src);
        const pdf = i >= 0 && /\.pdf$/i.test(src);
        const aud = i >= 0 && /\.(mp3|m4a|wav)$/i.test(src);
        if (aud) {
          qlPdf.hidden = true;
          qlVid.hidden = true;
          playTrack(el);
          ql.hidden = false;
          return;
        }
        qlAudio.hidden = true;
        qlMusic.hidden = true;
        qlImg.hidden = i < 0 || vid || pdf;
        qlVid.hidden = !vid;
        qlPdf.hidden = !pdf;
        qlFolder.hidden = i >= 0;
        if (pdf) {
          const stem = el.dataset.stem;
          pdfN = +el.dataset.pages || 1;
          pdfAt = 0;
          qlPdf.replaceChildren(...Array.from({ length: pdfN }, (_, i) => {
            const img = new Image();
            img.src = '/images/desk/' + stem + '-' + (i + 1) + '.png';
            img.alt = 'Page ' + (i + 1);
            if (i) img.loading = 'lazy';
            return img;
          }));
          qlPage.hidden = pdfN < 2;
          qlPage.textContent = '1 / ' + pdfN;
          qlPdf.scrollTop = 0;
          qlDl.hidden = stem !== 'resume';
        } else if (vid) {
          qlVid.poster = el.querySelector('img').src;
          qlVid.src = src;
          qlVid.play();
        } else if (i >= 0) {
          qlImg.src = src;
          qlImg.alt = el.querySelector('img').alt;
        }
        qlName.textContent = el.querySelector('figcaption').childNodes[0].textContent.trim();
        ql.hidden = false;
      }
      const pdfImgs = () => [...qlPdf.querySelectorAll('img')];
      const flipPdf = d => {
        if (qlPdf.hidden || !pdfN) return false;
        pdfAt = (pdfAt + d + pdfN) % pdfN;
        qlPdf.scrollTop = pdfImgs()[pdfAt].offsetTop;
        qlPage.textContent = (pdfAt + 1) + ' / ' + pdfN;
        return true;
      };
      qlPdf.addEventListener('scroll', () => {
        if (qlPdf.hidden) return;
        const imgs = pdfImgs();
        const i = imgs.findLastIndex(img => img.offsetTop <= qlPdf.scrollTop + 48);
        if (i < 0) return;
        pdfAt = i;
        qlPage.textContent = (i + 1) + ' / ' + pdfN;
      });
      const close = () => {
        if (!qlAudio.hidden && fromFolder) { open(folder); return; }
        ql.hidden = true; at = -1; stop();
      };
      // Arrows walk the photos; the folder window isn't part of that ring.
      const step = n => { if (at >= 0) open(files[(at + n + files.length) % files.length]); };

      document.getElementById('ql-close').addEventListener('click', close);
      // Clicking the dimmed area closes; clicking the panel itself doesn't.
      ql.addEventListener('pointerdown', e => { if (e.target === ql) close(); });

      addEventListener('keydown', e => {
        if (!ql.hidden) {
          if (e.key === 'Escape') { e.preventDefault(); close(); }
          if (e.key === ' ' && !qlAudio.hidden) { e.preventDefault(); player.paused ? player.play() : player.pause(); return; }
          if (e.key === ' ' && !qlVid.hidden) { e.preventDefault(); qlVid.paused ? qlVid.play() : qlVid.pause(); return; }
          if (e.key === ' ' ) { e.preventDefault(); close(); }
          if (e.key === 'ArrowRight') { e.preventDefault(); if (!flipPdf(1)) step(1); }
          if (e.key === 'ArrowLeft') { e.preventDefault(); if (!flipPdf(-1)) step(-1); }
          return;
        }
        // Space or Return on a selected icon opens it, same as the Finder.
        if (e.key !== ' ' && e.key !== 'Enter') return;
        const sel = icons.find(el => el.classList.contains('selected'));
        if (!sel) return;
        e.preventDefault();
        open(sel);
      });

      const skipSplash = document.documentElement.classList.contains('skip-splash');
      const splashUp = () => !skipSplash && [...document.querySelectorAll('#root div')].some(el => el.style.zIndex === '9999');
      const revealDesk = () => {
        if (document.body.classList.contains('desk-on')) return;
        if (!document.querySelector('.nav')) return;
        document.body.classList.add('desk-on');
      };
      let hashed = false;
      const jumpHash = () => {
        const id = location.hash.slice(1);
        if (hashed || !id) return;
        const el = document.getElementById(id);
        if (!el || splashUp()) return;
        hashed = true;
        el.scrollIntoView();
      };
      addEventListener('DOMContentLoaded', () => {
        revealDesk();
        jumpHash();
        new MutationObserver(() => { revealDesk(); jumpHash(); }).observe(document.getElementById('root'), { childList: true, subtree: true });
      });
    })();
  </script>
  <div id="root"></div>

</body>
